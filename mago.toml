#:schema https://mago.carthage.software/1.60.2/schema.json

# Mago configuration for craft-ai-observer.
# Docs: https://mago.carthage.software/latest/en/guide/configuration/

version = "1"
# Craft 6 / DDEV run PHP 8.5 (floor declared in composer.json is ^8.3)
php-version = "8.5"

[source]
paths = ["src", "tests"]

[source.glob]
# `*` matches one directory level, `**` is recursive (gitignore-style).
literal-separator = true

[linter]
# Enables PHPUnit/Pest-aware linter rules for the test suite.
integrations = ["phpunit"]

[analyzer]
# The library's rules require typed, readonly value objects — these checks
# keep type hints honest from day one.
check-missing-type-hints = true
check-property-initialization = true
find-unused-parameters = true
check-use-statements = true
check-name-casing = true

[formatter]
# Rules docs: "PSR-12, strict_types, typed".
preset = "psr-12"
# PSR-12 mandates LF line endings (`F.1` line endings).
end-of-line = "lf"